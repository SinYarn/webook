apiVersion: apps/v1
kind: Deployment
metadata:
  name: webook
# 规格说明, 描述 pods 是什么样的
spec:
# 副本数量
  replicas: 3
  selector:
    matchLabels:
      app: webook
#       template 描述的是你 POD 是什么样的
  template:
    metadata:
      labels:
        app: webook
#   POD的具体信息
    spec:
      containers:
        - name: webook
          image: could/webook:v0.0.5
          imagePullPolicy: IfNotPresent
          # 对应gin的端口
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: webook-data
              mountPath: /data
      volumes:
        # 单节点集群：3 副本必须共享同一块盘，否则分片/预览打到别的 Pod 就找不到文件
        - name: webook-data
          hostPath:
            path: /data/webook
            type: DirectoryOrCreate


